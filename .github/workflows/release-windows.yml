name: Release Windows app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match package.json version '$version'."
          }

      - name: Generate release description
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "PaletteSwap-Setup-$version.exe"
          $notes = @"
          最新バージョンがリリースされると更新が自動で適用されます。

          ### 利用方法
          ${installer}をダウンロードしてください。
          他のlatest.ymlや${installer}.blockmapのダウンロードは必要ありません。
          ### 連絡方法
          バグやご不明な点もしくは機能の追加希望がございましたらご気軽に外記フォームにてお問い合わせください
          https://docs.google.com/forms/d/e/1FAIpQLSfz1x1dTCFkPVVFcw2cvsOC74Os19-x55G2kyr8PIGhZiHarg/viewform?usp=publish-editor
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8NoBOM

      - name: Build and publish Windows installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
