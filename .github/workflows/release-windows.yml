name: Release Windows app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "既存Releaseを修復する場合はタグ（例: v1.0.13）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Release tag '$env:RELEASE_TAG' does not match package.json version '$version'."
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Generate release description
        run: |
          $installer = "PaletteSwap-Setup-$env:APP_VERSION.exe"
          $notes = @"
          最新バージョンがリリースされると更新が自動で適用されます。

          ### 利用方法
          ${installer}をダウンロードしてください。
          他のlatest.ymlや${installer}.blockmapのダウンロードは必要ありません。
          ### 連絡方法
          バグやご不明な点もしくは機能の追加希望がございましたらご気軽に外記フォームにてお問い合わせください
          https://docs.google.com/forms/d/e/1FAIpQLSfz1x1dTCFkPVVFcw2cvsOC74Os19-x55G2kyr8PIGhZiHarg/viewform?usp=publish-editor
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8NoBOM

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Upload installer and update files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = "dist/PaletteSwap-Setup-$env:APP_VERSION.exe"
          $files = @($installer, "$installer.blockmap", "dist/latest.yml")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Expected release file was not created: $file"
            }
          }

          $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --jq .id 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0) -and [bool]$releaseId
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @files --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release assets."
            }
            gh release edit $env:RELEASE_TAG --title $env:APP_VERSION --notes-file release-notes.md --latest
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update the GitHub Release."
            }
          } else {
            gh release create $env:RELEASE_TAG @files --title $env:APP_VERSION --notes-file release-notes.md --latest
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the GitHub Release."
            }
          }
